<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — S4SIT SOLUTION LLC</title>
  <link rel="icon" type="image/png" href="Logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
<header class="site-header">
  <div class="container navbar">
    <a href="/" class="brand">
      <img src="Logo.png" alt="S4SIT Logo" class="brand-logo"/>
      <span class="brand-name">S4SIT <span class="brand-accent">SOLUTION</span></span>
    </a>
  </div>
</header>
<section style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;">
  <div>
    <div style="font-size:5rem;margin-bottom:16px">404</div>
    <h1 style="font-size:2rem;color:var(--white);margin-bottom:12px">Page Not Found</h1>
    <p style="color:var(--muted);max-width:400px;margin:0 auto 32px">This page doesn't exist. Let's get you back to the right place.</p>
    <a href="/" class="btn btn-primary">← Back to Home</a>
  </div>
</section>
<style>
  :root{--bg:#040e1c;--bg2:#071428;--card:#0f2040;--border:#1a3050;--accent:#00d084;--accent2:#0ea5e9;--text:#e6f1ff;--muted:#8892b0;--white:#ffffff;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .site-header{background:rgba(4,14,28,.92);border-bottom:1px solid var(--border);padding:14px 0;}
  .navbar{display:flex;align-items:center;max-width:1180px;margin:0 auto;padding:0 20px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);}
  .brand-logo{height:36px;border-radius:6px;}
  .brand-name{font-weight:800;font-size:1.1rem;}
  .brand-accent{color:var(--accent);}
  .btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:700;text-decoration:none;background:var(--accent);color:#052e16;}
</style>
</body>
</html>
