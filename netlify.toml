[build]
  publish = "."

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/chatbot.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
