[build]
  publish = "."

# Old page URLs from the previous site
[[redirects]]
  from = "/about.html"
  to = "/#studio"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/portfolio.html"
  to = "/#work"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
